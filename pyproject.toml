[project]
name = "smart-greenhouse-sim"
version = "0.1.0"
description = "Industrial-grade digital twin for greenhouse climate and resource management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "gradio",
    "pandas",
    "numpy",
    "openai",
    "python-dotenv",
    "openenv>=0.1.0"
]

[project.scripts]
server = "greenhouse.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenhouse"]
