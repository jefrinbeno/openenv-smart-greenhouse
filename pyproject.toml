[project]
name = "openenv-smart-greenhouse"
version = "0.1.0"
description = "AI-ready digital twin for greenhouse climate management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "gradio",
    "pandas",
    "numpy",
    "openai",
    "requests",
    "python-dotenv",
    "openenv>=0.1.0"
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
