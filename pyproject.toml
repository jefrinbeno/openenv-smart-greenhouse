[project]
name = "openenv-smart-greenhouse"
version = "1.0.0"
description = "AI-ready digital twin for greenhouse climate management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "gradio",
    "pandas",
    "numpy",
    "openai",
    "requests",
    "python-dotenv",
    "openenv>=0.1.0"
]

# THIS IS THE PART THE POP-UP IS ASKING FOR
[project.scripts]
server = "server.app:main"

[project.entry-points."openenv.environments"]
smart-greenhouse = "openenv_smart_greenhouse:GreenhouseEnv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
