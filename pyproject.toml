[project]
name = "openenv-smart-greenhouse"
version = "1.0.0"
description = "AI-ready digital twin for greenhouse climate management."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "gradio",
    "openai",
    "requests",
    "openenv>=0.1.0"
]

[project.scripts]
server = "greenhouse.server.app:main"

[project.entry-points."openenv.environments"]
smart-greenhouse = "openenv_smart_greenhouse:GreenhouseEnv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
